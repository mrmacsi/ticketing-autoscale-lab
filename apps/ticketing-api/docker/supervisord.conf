[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g 'daemon off;'
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:migrations]
command = php /var/www/html/artisan lab:migrate --timeout=600 --no-interaction
environment = HOME="/var/www"
autostart = true ; migrations
autorestart = unexpected
exitcodes = 0
startsecs = 0
startretries = 100
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:reservation-expiry]
command = php /var/www/html/artisan reservations:expire --loop --interval=2
user = www-data
; libpq looks for client certificates under $HOME; root's home is not readable by www-data.
environment = HOME="/var/www"
autorestart = true
startsecs = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:cpu-sampler]
command = /usr/local/bin/cpu-sampler
autorestart = true
stdout_logfile = /dev/null
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
