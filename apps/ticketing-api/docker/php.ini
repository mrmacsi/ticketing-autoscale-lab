expose_php = Off
memory_limit = 256M
max_execution_time = 35
display_errors = Off
log_errors = On
error_log = /dev/stderr
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
; Classes of a typical request linked once at FPM start (docker/preload.php); see the measurements there.
; JIT stays off: tracing and function JIT both measured slower or no better for this request mix.
opcache.preload = /var/www/html/docker/preload.php
opcache.preload_user = www-data
