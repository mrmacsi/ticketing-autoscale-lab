# The load balancer opens many concurrent backend connections; each proxied request uses two
# (client + FastCGI). The Alpine default of 1024 per worker is exhausted under burst traffic.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_requests 100000;
    include /etc/nginx/http.d/*.conf;
}
