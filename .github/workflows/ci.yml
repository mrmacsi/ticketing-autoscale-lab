# Runs every test suite on each push and pull request. Offline only: no Google Cloud credentials,
# no deploys (Terraform tests use mocked providers).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/waiting-room, load-generator]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/control-api, apps/dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ticketing_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: apps/ticketing-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, bcmath, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: php artisan test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive terraform
      - name: terraform test (root and modules, mocked providers)
        run: |
          for dir in terraform/environments/autoscaling-lab terraform/modules/*; do
            compgen -G "$dir/*.tftest.hcl" >/dev/null || compgen -G "$dir/tests/*.tftest.hcl" >/dev/null || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests
      - run: for f in scripts/*.sh; do bash -n "$f"; done
