# Local stand-in for the load balancer in front of the waiting room: round robin over the queue
# replicas (they share one Redis, so any replica answers any customer). Long polls last up to 25 s and
# every waiting customer holds two connections here (client + upstream), so the default 1,024
# connections per worker are far too few: the first 10,000-customer run stalled on
# "worker_connections are not enough". The Google load balancer in the cloud has no such limit.
worker_processes auto;
worker_rlimit_nofile 262144;

events {
    worker_connections 65536;
}

http {
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream waiting_room {
        zone waiting_room 64k;
        server waiting-room-1:8080 resolve max_fails=1 fail_timeout=3s;
        server waiting-room-2:8080 resolve max_fails=1 fail_timeout=3s;
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://waiting_room;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
            # A replica that is restarting refuses connections: try the other one (also for POST, which
            # is safe because nothing reached the stopped replica).
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
